trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

pool: 'Self-Hosted'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  nodeVersion: '25.x'
  solution: '**/*.sln'
  testProjects: '**/*Tests*.csproj'
  sonarProjectKey: 'wechooz-tech-assessment'
  sonarProjectName: 'WeChooz Tech Assessment'

stages:
  # ============================================================
  # Stage 1 : Build, Tests et Analyse SonarQube
  # ============================================================
  - stage: BuildAndTest
    displayName: '🏗️ Build, Test & SonarQube'
    jobs:
      - job: Build
        displayName: 'Build & Analyse'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              includePreviewVersions: true

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - script: |
              cd WeChooz.TechAssessment.Web
              corepack enable
              yarn install --immutable
              yarn build
            displayName: 'yarn install & build'
            workingDirectory: '$(Build.SourcesDirectory)/WeChooz.TechAssessment.Web'

          # SonarQube — Début
          - task: SonarQubePrepare@7
            displayName: 'SonarQube — Prepare'
            inputs:
              SonarQube: 'SonarQube-ServiceConnection'
              scannerMode: 'dotnet'
              projectKey: '$(sonarProjectKey)'
              projectName: '$(sonarProjectName)'
              extraProperties: |
                sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/coverage.opencover.xml
                sonar.exclusions=**/node_modules/**,**/wwwroot/**,**/obj/**,**/bin/**
                sonar.coverage.exclusions=**/*Tests*/**,**/Program.cs

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'
          - task: DotNetCoreCLI@2
            displayName: 'dotnet test'
            inputs:
              command: 'test'
              projects: '$(testProjects)'
              publishTestResults: false
              arguments: >-
                --configuration $(buildConfiguration)
                --no-build
                --collect "Code Coverage;Format=Cobertura"
                --results-directory "$(Agent.TempDirectory)/TestResults"
                --logger trx
                -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
            env:
              DOTNET_ENVIRONMENT: 'Testing'

          # SonarQube — Analyse
          - task: SonarQubeAnalyze@7
            displayName: 'SonarQube — Analyze'

          # SonarQube — Quality Gate
          - task: SonarQubePublish@7
            displayName: 'SonarQube — Quality Gate'
            inputs:
              pollingTimeoutSec: '300'

          # Résultats de tests
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              testRunTitle: 'Unit & Integration Tests'

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage'
            condition: always()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.opencover.xml'

  # ============================================================
  # Stage 2 : Publish (uniquement main)
  # ============================================================
  - stage: Publish
    displayName: '📦 Publish Artifacts'
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PublishArtifacts
        displayName: 'Publish'
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              includePreviewVersions: true

          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - script: |
              cd WeChooz.TechAssessment.Web
              corepack enable
              yarn install --immutable
              yarn build
            displayName: 'yarn install & build'
            workingDirectory: '$(Build.SourcesDirectory)/WeChooz.TechAssessment.Web'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish'
            inputs:
              command: 'publish'
              projects: '**/WeChooz.TechAssessment.Web.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'