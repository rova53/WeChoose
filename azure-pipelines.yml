trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

pool: 'Self-Hosted'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  nodeVersion: '25.x'
  solution: '**/*.sln'
  testProjects: '**/*Tests*.csproj'
  webProject: '**/WeChooz.TechAssessment.Web.csproj'
  webDirectory: 'WeChooz.TechAssessment.Web'

stages:
  # ============================================================
  # Stage 1 : Build, Tests et Analyse SonarQube
  # ============================================================
  - stage: BuildAndTest
    displayName: '🏗️ Build, Test & SonarQube'
    jobs:
      - job: Build
        displayName: 'Build & Analyse'
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              includePreviewVersions: true

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - script: |
              corepack enable
              yarn install --immutable
              yarn build
            displayName: 'yarn install & build'
            workingDirectory: '$(Build.SourcesDirectory)/$(webDirectory)'

          # SonarCloud — Début
          - task: SonarCloudPrepare@3
            displayName: 'SonarCloud — Prepare'
            inputs:
              SonarCloud: 'Sonar-cloud'
              organization: 'rrabemalanto'
              scannerMode: 'MSBuild'
              projectKey: 'rrabemalanto_WeChoose'
              projectName: 'WeChoose'
              extraProperties: |
                sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/TestResults/**/coverage.opencover.xml
                sonar.exclusions=**/node_modules/**,**/wwwroot/**,**/obj/**,**/bin/**
                sonar.coverage.exclusions=**/*Tests*/**,**/Program.cs

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet test'
            inputs:
              command: 'test'
              projects: '$(testProjects)'
              publishTestResults: false
              arguments: >-
                --configuration $(buildConfiguration)
                --no-build
                --collect:"XPlat Code Coverage"
                --results-directory "$(Agent.TempDirectory)/TestResults"
                --logger "trx;LogFileName=testresults.trx"
                -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
            env:
              DOTNET_ENVIRONMENT: 'Testing'

          # SonarCloud — Analyse
          - task: SonarCloudAnalyze@3
            displayName: 'SonarCloud — Analyze'

          # SonarCloud — Quality Gate
          - task: SonarCloudPublish@3
            displayName: 'SonarCloud — Quality Gate'
            inputs:
              pollingTimeoutSec: '300'

          # Résultats de tests
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              testRunTitle: 'Unit & Integration Tests'

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Code Coverage'
            condition: always()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

  # ============================================================
  # Stage 2 : Publish (uniquement main)
  # ============================================================
  - stage: Publish
    displayName: '📦 Publish Artifacts'
    dependsOn: BuildAndTest
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PublishArtifacts
        displayName: 'Publish'
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'
              includePreviewVersions: true

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - script: |
              corepack enable
              yarn install --immutable
              yarn build
            displayName: 'yarn install & build'
            workingDirectory: '$(Build.SourcesDirectory)/$(webDirectory)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish'
            inputs:
              command: 'publish'
              projects: '$(webProject)'
              arguments: '--configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Build Artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'